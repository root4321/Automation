name: Automation tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to use for UI scenarios
        type: choice
        required: true
        default: chrome
        options:
          - chrome
          - edge
          - safari
      environment:
        description: Spring environment and GitHub Environment to use
        type: choice
        required: true
        default: dev
        options:
          - dev
          - pre
          - prod
      tags:
        description: Cucumber tag expression
        type: string
        required: true
        default: "@uiSanity"
      retry_count:
        description: Times to re-run failed scenarios (0-4, values above 4 are capped at 4)
        type: string
        required: true
        default: "3"
      threads:
        description: Scenarios to run in parallel (Safari always uses 1)
        type: string
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.environment }} / ${{ inputs.browser }}
    runs-on: ${{ inputs.browser == 'safari' && 'macos-latest' || 'ubuntu-latest' }}
    environment:
      name: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Enable Safari WebDriver
        if: inputs.browser == 'safari'
        run: sudo safaridriver --enable

      - name: Run Cucumber tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          SHOP_EMAIL: ${{ secrets.SHOP_EMAIL }}
          SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
          TEST_ENVIRONMENT: ${{ inputs.environment }}
          TEST_BROWSER: ${{ inputs.browser }}
          TEST_TAGS: ${{ inputs.tags }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          THREADS: ${{ inputs.browser == 'safari' && '1' || inputs.threads }}
          BROWSER_HEADLESS: ${{ inputs.browser == 'safari' && 'false' || 'true' }}
        run: |
          if [ -z "$API_BASE_URL" ]; then unset API_BASE_URL; fi
          if [ -z "$API_KEY" ]; then unset API_KEY; fi
          if [ -z "$UI_BASE_URL" ]; then unset UI_BASE_URL; fi
          if [ -z "$SHOP_EMAIL" ]; then unset SHOP_EMAIL; fi
          if [ -z "$SHOP_PASSWORD" ]; then unset SHOP_PASSWORD; fi
          mvn --batch-mode --no-transfer-progress clean test \
            -Dspring.profiles.active="$TEST_ENVIRONMENT" \
            -Dbrowser="$TEST_BROWSER" \
            -Dbrowser.headless="$BROWSER_HEADLESS" \
            -Dcucumber.filter.tags="$TEST_TAGS" \
            -Dretry.count="$RETRY_COUNT" \
            -Dthreads="$THREADS"

      - name: Summarise consolidated results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = "target/cucumber/cucumber.json"
          if not os.path.exists(path):
              print("No consolidated Cucumber results were produced.")
              raise SystemExit
          counts, failed = {}, []
          for feature in json.load(open(path)):
              for element in feature.get("elements", []):
                  if element.get("type") != "scenario":
                      continue
                  steps = [s.get("result", {}).get("status", "") for s in element.get("steps", [])]
                  for hook in element.get("before", []) + element.get("after", []):
                      steps.append(hook.get("result", {}).get("status", ""))
                  status = "failed" if any(x in ("failed", "undefined", "pending") for x in steps) else "passed"
                  counts[status] = counts.get(status, 0) + 1
                  if status == "failed":
                      failed.append(f"{feature.get('name')} / {element.get('name')}")
          print("### Consolidated Cucumber results (after retries)")
          print(f"- Passed: {counts.get('passed', 0)}")
          print(f"- Failed: {counts.get('failed', 0)}")
          for name in failed:
              print(f"  - {name}")
          print("\nOpen the `reports-*` artifact: `cucumber-html-reports/overview-features.html` has the single consolidated report.")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.environment }}-${{ inputs.browser }}
          path: |
            target/cucumber-report.html
            target/cucumber/
            target/rerun/
            target/cucumber-html-reports/
            target/extent/
            target/screenshots/
          if-no-files-found: warn
